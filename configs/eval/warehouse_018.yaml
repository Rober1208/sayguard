# Test scene for site mode: nothing is trained or tuned on it; scripts/eval_site.py only measures.
# 3 synchronized, calibrated cameras of NVIDIA PhysicalAI-SmartSpaces MTMC_Tracking_2026 train/Warehouse_018
# (synthetic, CC BY 4.0); the site detector never trains on it.  Zones were drawn on the floor plan
# (map.png pixels) where at least two cameras see a standing person >= 40 px tall, by a reviewer who
# had not seen any result.  Prepare and measure:
#   python scripts/fetch_smartspaces.py train/Warehouse_018
#   python scripts/make_site_streams.py train/Warehouse_018
#   python scripts/eval_site.py --config configs/eval/warehouse_018.yaml --all-zones

site_name: "Warehouse 018 (synthetic, NVIDIA PhysicalAI-SmartSpaces)"

site:
  calibration: "@work/datasets/smartspaces/train/Warehouse_018/calibration.json"
  plan: "@work/datasets/smartspaces/train/Warehouse_018/map.png"
  zone: warehouse
  plan_width: 960

detector:
  backend: ultralytics
  name: "YOLOv8s-site"
  weights: "@work/models/site_yolov8s.pt"
  hef: "@work/models/site_yolov8s.hef"
  labels: [person, forklift, pallet_truck, transporter, mobile_robot, humanoid_robot]
  imgsz: 960
  conf: 0.25
  half: true

open_vocab:
  enabled: false

llm:
  base_url: "http://127.0.0.1:11434"
  model: "qwen2.5:1.5b"
  timeout_s: 60

asr:
  model: "@work/models/hf/whisper-small"
  language: "en"

verifier:
  enabled: false
  backend: clip_probe

streams:
  fps: 10
  tile_width: 640

privacy:
  blur_faces: true

cameras:
  - {id: cam00, calib: Camera_0000, name: "Camera 00", zone: warehouse, source: "@work/videos/site/Warehouse_018/Camera_0000.mp4"}
  - {id: cam01, calib: Camera_0001, name: "Camera 01", zone: warehouse, source: "@work/videos/site/Warehouse_018/Camera_0001.mp4"}
  - {id: cam02, calib: Camera_0002, name: "Camera 02", zone: warehouse, source: "@work/videos/site/Warehouse_018/Camera_0002.mp4"}

zones:
  staging_west_walkway: {en: "Staging west walkway", zh: "暫存區西側走道", plan_polygon: [[1112, 625], [1196, 625], [1196, 945], [1114, 945], [1090, 880], [1090, 670]]}
  loading_dock_staging: {en: "Loading dock staging area", zh: "碼頭裝卸暫存區", plan_polygon: [[1200, 598], [1439, 598], [1439, 978], [1200, 978]]}
  north_open_floor: {en: "North open floor by east door", zh: "東側門北面空地", plan_polygon: [[1132, 592], [1439, 592], [1439, 338], [1190, 532]]}
  warehouse: {en: "Warehouse", zh: "倉庫"}

rules_file: "@work/state_eval/warehouse_018/rules.json"
events_db: "@work/state_eval/warehouse_018/events.db"
snapshots_dir: "@work/state_eval/warehouse_018/snapshots"
retention_days: 14

default_rules:
  - name: "Keep 3 m from forklifts"
    type: object_near_person
    object: forklift
    threshold: 3.0
    cameras: ["*"]
    zones: ["warehouse"]
    min_duration_s: 2.0
    cooldown_s: 60.0
    severity: high
    message: "Worker within 3 m of a forklift"

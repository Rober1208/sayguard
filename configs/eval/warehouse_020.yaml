# Validation scene for site mode: the measured settings (worker and vehicle confidence, forklift distance margin) are chosen here, never on the test scenes.
# 16 synchronized, calibrated cameras of NVIDIA PhysicalAI-SmartSpaces MTMC_Tracking_2026 val/Warehouse_020
# (synthetic, CC BY 4.0); the site detector never trains on it.  Zones were drawn on the floor plan
# (map.png pixels) where at least two cameras see a standing person >= 40 px tall, by a reviewer who
# had not seen any result.  Prepare and measure:
#   python scripts/fetch_smartspaces.py val/Warehouse_020
#   python scripts/make_site_streams.py val/Warehouse_020
#   python scripts/eval_site.py --config configs/eval/warehouse_020.yaml --all-zones

site_name: "Warehouse 020 (synthetic, NVIDIA PhysicalAI-SmartSpaces)"

site:
  calibration: "@work/datasets/smartspaces/val/Warehouse_020/calibration.json"
  plan: "@work/datasets/smartspaces/val/Warehouse_020/map.png"
  zone: warehouse
  plan_width: 960

detector:
  backend: ultralytics
  name: "YOLOv8s-site"
  weights: "@work/models/site_yolov8s.pt"
  hef: "@work/models/site_yolov8s.hef"
  labels: [person, forklift, pallet_truck, transporter, mobile_robot, humanoid_robot]
  imgsz: 960
  conf: 0.25
  half: true

open_vocab:
  enabled: false

llm:
  base_url: "http://127.0.0.1:11434"
  model: "qwen2.5:1.5b"
  timeout_s: 60

asr:
  model: "@work/models/hf/whisper-small"
  language: "en"

verifier:
  enabled: false
  backend: clip_probe

streams:
  fps: 10
  tile_width: 640

privacy:
  blur_faces: true

cameras:
  - {id: cam00, calib: Camera_0000, name: "Camera 00", zone: warehouse, source: "@work/videos/site/Warehouse_020/Camera_0000.mp4"}
  - {id: cam01, calib: Camera_0001, name: "Camera 01", zone: warehouse, source: "@work/videos/site/Warehouse_020/Camera_0001.mp4"}
  - {id: cam02, calib: Camera_0002, name: "Camera 02", zone: warehouse, source: "@work/videos/site/Warehouse_020/Camera_0002.mp4"}
  - {id: cam03, calib: Camera_0003, name: "Camera 03", zone: warehouse, source: "@work/videos/site/Warehouse_020/Camera_0003.mp4"}
  - {id: cam04, calib: Camera_0004, name: "Camera 04", zone: warehouse, source: "@work/videos/site/Warehouse_020/Camera_0004.mp4"}
  - {id: cam05, calib: Camera_0005, name: "Camera 05", zone: warehouse, source: "@work/videos/site/Warehouse_020/Camera_0005.mp4"}
  - {id: cam09, calib: Camera_0009, name: "Camera 09", zone: warehouse, source: "@work/videos/site/Warehouse_020/Camera_0009.mp4"}
  - {id: cam10, calib: Camera_0010, name: "Camera 10", zone: warehouse, source: "@work/videos/site/Warehouse_020/Camera_0010.mp4"}
  - {id: cam11, calib: Camera_0011, name: "Camera 11", zone: warehouse, source: "@work/videos/site/Warehouse_020/Camera_0011.mp4"}
  - {id: cam12, calib: Camera_0012, name: "Camera 12", zone: warehouse, source: "@work/videos/site/Warehouse_020/Camera_0012.mp4"}
  - {id: cam13, calib: Camera_0013, name: "Camera 13", zone: warehouse, source: "@work/videos/site/Warehouse_020/Camera_0013.mp4"}
  - {id: cam15, calib: Camera_0015, name: "Camera 15", zone: warehouse, source: "@work/videos/site/Warehouse_020/Camera_0015.mp4"}
  - {id: cam16, calib: Camera_0016, name: "Camera 16", zone: warehouse, source: "@work/videos/site/Warehouse_020/Camera_0016.mp4"}
  - {id: cam17, calib: Camera_0017, name: "Camera 17", zone: warehouse, source: "@work/videos/site/Warehouse_020/Camera_0017.mp4"}
  - {id: cam18, calib: Camera_0018, name: "Camera 18", zone: warehouse, source: "@work/videos/site/Warehouse_020/Camera_0018.mp4"}
  - {id: cam19, calib: Camera_0019, name: "Camera 19", zone: warehouse, source: "@work/videos/site/Warehouse_020/Camera_0019.mp4"}

zones:
  pallet_row_aisle: {en: "Pallet row aisle", zh: "棧板列走道", plan_polygon: [[775, 840], [985, 840], [985, 873], [775, 873]]}
  pallet_staging_bays: {en: "Pallet staging bays", zh: "棧板暫存區", plan_polygon: [[1000, 720], [1178, 720], [1178, 888], [1000, 888]]}
  conveyor_work_cell: {en: "Conveyor loop work cell", zh: "輸送帶作業區", plan_polygon: [[716, 298], [888, 298], [888, 482], [716, 482]]}
  conveyor_side_walkway: {en: "Conveyor-side walkway", zh: "輸送帶旁通道", plan_polygon: [[663, 298], [701, 298], [701, 488], [663, 488]]}
  warehouse: {en: "Warehouse", zh: "倉庫"}

rules_file: "@work/state_eval/warehouse_020/rules.json"
events_db: "@work/state_eval/warehouse_020/events.db"
snapshots_dir: "@work/state_eval/warehouse_020/snapshots"
retention_days: 14

default_rules:
  - name: "Keep 3 m from forklifts"
    type: object_near_person
    object: forklift
    threshold: 3.0
    cameras: ["*"]
    zones: ["warehouse"]
    min_duration_s: 2.0
    cooldown_s: 60.0
    severity: high
    message: "Worker within 3 m of a forklift"
